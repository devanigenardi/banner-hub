<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="ad.size" content="width=300,height=250">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="x-ua-compatible" content="ie=edge">

    <script>
      /* 
        CLICKTAGS
        Add/Remove as many clicktag variables as required
        URL destinations should never be hardcoded directly into anchor/button elements.
        Instead they need to exist here, so ad servers can track exits and also change them.
        Add the data-exit parameter on each tag that requires to fire a clickTag, 
        and provide the name of the variable containing the URL that needs to be called.
        EG: <div class="exit-trigger" data-exit="clickTag1"></div>
      */
      var clickTag1 = '#clickTag1';
    </script>

    <script src="https://s0.2mdn.net/ads/studio/cached_libs/gsap_3.11.1_min.js"></script>
    <script src="js/banner-scripts.js"></script>
  </head>

  <body>
    <div id="banner-wrapper">
      
      <div id="stage" style="visibility: hidden;">
        <div id="bg"></div>
        <div id="f1-txt-1"></div>
        <div id="f1-txt-2"></div>
        <div id="f2-txt-1"></div>
        <div id="f3-txt-1"></div>
        <div id="f3-logo"></div>
        <div id="f4-txt-1"></div>
        <div id="f4-full-logo"></div>
        <div id="cta"></div>
        <div class="exit-trigger" data-exit="clickTag1"></div>

      </div>

      <div id="preloader">
        <svg width="38" height="38" viewBox="0 0 38 38" xmlns="http://www.w3.org/2000/svg" stroke="#808080"><g fill="none" fill-rule="evenodd"><g transform="translate(1 1)" stroke-width="2"><circle stroke-opacity=".5" cx="18" cy="18" r="18"/><path d="M36 18c0-9.94-8.06-18-18-18"><animateTransform attributeName="transform" type="rotate" from="0 18 18" to="360 18 18" dur="1s" repeatCount="indefinite"/></path></g></g></svg>
      </div>

    </div>
  </body>
</html>
